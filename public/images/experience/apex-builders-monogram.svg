<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96" role="img" aria-labelledby="title desc">
  <title id="title">Apex Builders initials mark</title>
  <desc id="desc">A neutral AB initials mark used because an official Apex Builders logo was not supplied.</desc>
  <rect width="260" height="96" rx="18" fill="#F7F3EA"/>
  <circle cx="48" cy="48" r="30" fill="#173640"/>
  <text x="48" y="57" text-anchor="middle" fill="#F7F3EA" font-family="Georgia, serif" font-size="26" font-weight="700">AB</text>
  <text x="92" y="43" fill="#173640" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">APEX</text>
  <text x="92" y="64" fill="#6B7E84" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">BUILDERS</text>
</svg>
