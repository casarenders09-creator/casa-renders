<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" role="img" aria-labelledby="title desc">
  <title id="title">Kautilya Infratech initials mark</title>
  <desc id="desc">A neutral KI initials mark used until an official Kautilya Infratech logo is supplied.</desc>
  <rect width="300" height="96" rx="18" fill="#F7F3EA"/>
  <circle cx="48" cy="48" r="30" fill="#264D45"/>
  <text x="48" y="57" text-anchor="middle" fill="#F7F3EA" font-family="Georgia, serif" font-size="26" font-weight="700">KI</text>
  <text x="92" y="42" fill="#173640" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.8">KAUTILYA</text>
  <text x="92" y="64" fill="#6B7E84" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">INFRATECH</text>
</svg>
